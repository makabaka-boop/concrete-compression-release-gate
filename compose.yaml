services:
  api:
    build: .
    image: concrete-strength-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # 台账 SQLite 文件位置；挂载命名卷使记录跨容器重建保留
      EVALUATION_DB_PATH: /srv/app/data/evaluations.db
    volumes:
      - ledger:/srv/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    image: concrete-strength-api
    build: .
    command: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  ledger:
